<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הספר שלנו</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#ff6b4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הספר שלנו">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff7ec; --card:#ffffff; --ink:#2d1f3d; --muted:#7d6f86; --line:#f0e2d0;
    --tomato:#ff6b4a; --mango:#ffb627; --mint:#3cc4a0; --berry:#c04ce0; --sky:#4a9dff;
    --tomato-soft:#ffe3dc; --mango-soft:#fff0cc; --mint-soft:#d8f5ec; --berry-soft:#f4defa; --sky-soft:#dcebff;
    --radius:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;color:var(--ink);font:16px/1.5 Rubik,system-ui,sans-serif}
  body{background:var(--bg);background-image:radial-gradient(circle at 90% 0%,#ffe1c7 0,transparent 40%),radial-gradient(circle at 5% 20%,#f6e0ff 0,transparent 35%);background-attachment:fixed;min-height:100vh}
  h1,h2,h3{font-family:Fredoka,Rubik,sans-serif;font-weight:600;margin:0}
  button,input,select,textarea{font:inherit;color:inherit}
  input,select,textarea{font-size:16px} /* prevents iPhone zoom */
  .wrap{max-width:760px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(100px + env(safe-area-inset-bottom))}

  header.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .logo{width:48px;height:48px;border-radius:15px;background:var(--tomato);display:grid;place-items:center;font-size:26px;transform:rotate(6deg);box-shadow:0 4px 0 #d94e30;flex:none;transition:background .2s}
  header.top h1{font-size:25px;font-weight:700;line-height:1.1}
  header.top .sub{color:var(--muted);font-size:13px}

  /* bottom tab bar */
  .tabbar{position:fixed;bottom:0;left:0;right:0;z-index:8;display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(255,247,236,.92);backdrop-filter:blur(8px);border-top:2px solid var(--line)}
  .tabbar .inner{display:flex;gap:8px;width:100%;max-width:420px}
  .tab{flex:1;border:0;background:transparent;border-radius:16px;padding:9px 6px;cursor:pointer;font-family:Fredoka,sans-serif;font-weight:600;font-size:16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
  .tab .e{font-size:22px;line-height:1}
  .tab.on{background:var(--ink);color:#fff}

  .btn{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:9px 15px;cursor:pointer;font-weight:500;transition:transform .08s;min-height:44px}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--tomato);border-color:var(--tomato);color:#fff;font-family:Fredoka,sans-serif;font-weight:600;box-shadow:0 3px 0 #d94e30}
  .btn.green{background:var(--mint);border-color:var(--mint);color:#fff;box-shadow:0 3px 0 #2a9e80}
  .btn.danger{color:#c62828}
  .btn.ghost{background:transparent;border-color:transparent}
  .btn.small{min-height:36px;padding:5px 11px;font-size:14px;border-radius:11px}
  .btn:disabled{opacity:.5;cursor:default}
  .fetchbtn{border:2px dashed var(--mango);background:var(--mango-soft);font-weight:600;width:100%}
  .fetchbox{display:flex;flex-direction:column;gap:8px}
  .fetchbox .l{font-size:14px;font-weight:600}
  .iconbtn{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;font-size:16px;flex:none;padding:0}
  .iconbtn:disabled{opacity:.3}

  .quick{background:var(--card);border:2px dashed #ffc9b8;border-radius:var(--radius);padding:14px;margin-bottom:16px;display:flex;flex-direction:column;gap:9px}
  .quick.green{border-color:#a8e6d4}
  .quick .title{font-family:Fredoka,sans-serif;font-weight:600;font-size:17px}
  .row{display:flex;gap:8px}
  .row > *{min-width:0}
  .grow{flex:1}
  input[type=text],input[type=url],select,textarea{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--mango)}
  input[type=url]{direction:ltr;text-align:left}
  input[type=url]::placeholder{text-align:right}
  textarea{resize:vertical;min-height:110px}
  .photobtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:6px;border:2px dashed var(--line);background:#fffaf3;border-radius:12px;padding:8px 12px;cursor:pointer;font-size:15px;min-height:44px}
  .vh{position:absolute!important;width:1px!important;height:1px!important;opacity:0;overflow:hidden;pointer-events:none}
  .pastebox{width:auto!important;flex:1 1 150px;min-height:44px;border-style:dashed!important;background:#fffaf3!important;font-size:15px!important}
  .pastebox:focus{caret-color:transparent}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap}
  .thumb{position:relative;width:64px;height:64px;border-radius:12px;overflow:hidden;background:var(--line)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb button{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;cursor:pointer;display:grid;place-items:center;padding:0}
  .thumb.loading::after{content:"⏳";position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.6)}

  .filters{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;margin:0 -14px;padding-inline:14px}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:14px}
  .chip.on{background:var(--mango);border-color:var(--mango);font-weight:600}
  .chip .n{opacity:.55;margin-inline-start:4px;font-size:12px}
  .search-row{display:flex;gap:8px}
  .search-row input{flex:1}
  .search-row select{width:auto}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
  .card{background:var(--card);border-radius:18px;cursor:pointer;display:flex;flex-direction:column;overflow:hidden;border:2px solid var(--line);transition:transform .12s}
  .card:active{transform:scale(.98)}
  .card .top{aspect-ratio:4/3;display:grid;place-items:center;font-size:40px;overflow:hidden}
  .card .top img{width:100%;height:100%;object-fit:cover;display:block}
  .card .inner{padding:10px 11px 12px;display:flex;flex-direction:column;gap:6px}
  .card h3{font-size:16px;line-height:1.25;word-break:break-word}
  .meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12px;color:var(--muted)}
  .tag{border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;background:var(--berry-soft);color:#8a2ca6}
  .tag.later{background:var(--mango-soft);color:#9a6400}
  .tag.done{background:var(--mint-soft);color:#1d7a5f}
  .tag.been{background:var(--mint-soft);color:#1d7a5f}

  /* restaurants list */
  .sec-title{font-family:Fredoka,sans-serif;font-weight:600;font-size:18px;margin:18px 2px 10px;display:flex;align-items:center;gap:8px}
  .sec-title .n{font-size:13px;color:var(--muted);font-family:Rubik}
  .plist{display:flex;flex-direction:column;gap:10px}
  .prow{background:var(--card);border:2px solid var(--line);border-radius:18px;display:flex;align-items:stretch;overflow:hidden}
  .prow .body{flex:1;display:flex;gap:10px;padding:10px;cursor:pointer;min-width:0;align-items:center}
  .prow .pic{width:62px;height:62px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:28px;overflow:hidden;position:relative}
  .prow .pic img{width:100%;height:100%;object-fit:cover}
  .prow .rank{position:absolute;top:-1px;right:-1px;background:var(--ink);color:#fff;font-family:Fredoka;font-weight:600;font-size:13px;min-width:22px;height:22px;border-radius:0 0 0 10px;display:grid;place-items:center;padding:0 5px}
  .prow .txt{min-width:0;display:flex;flex-direction:column;gap:2px}
  .prow h3{font-size:16px;line-height:1.25;word-break:break-word}
  .prow .small{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prow .side{display:flex;flex-direction:column;gap:6px;padding:8px;justify-content:center;align-items:center;border-inline-start:2px solid var(--line);background:#fffaf3}
  .prow .arrows{display:flex;flex-direction:column;gap:4px}
  .beenbtn{border:2px solid var(--mango);background:var(--mango-soft);color:#8a5a00;border-radius:12px;padding:6px 8px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;min-height:40px}
  .prow.been{border-color:#a8e6d4}
  .prow.been .side{background:var(--mint-soft);border-color:#a8e6d4}
  .undo{border:2px solid var(--mint);background:#fff;color:#1d7a5f;border-radius:12px;padding:6px 8px;font-size:12px;cursor:pointer;white-space:nowrap;min-height:40px}

  .empty{text-align:center;color:var(--muted);padding:34px 16px;border:2px dashed var(--line);border-radius:var(--radius);background:rgba(255,255,255,.6)}
  .empty .big{font-size:40px;display:block;margin-bottom:6px}
  .notice{background:var(--mango-soft);color:#6b4a10;border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:14px}

  /* sheets */
  .overlay{position:fixed;inset:0;background:rgba(45,31,61,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .overlay.open{display:flex}
  .panel{background:var(--bg);border-radius:24px 24px 0 0;max-width:680px;width:100%;max-height:94vh;overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.2);animation:up .2s ease-out}
  @media(min-width:700px){.overlay{align-items:center;padding:20px}.panel{border-radius:24px;max-height:90vh}}
  @keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
  .grab{width:44px;height:5px;border-radius:9px;background:#e3d4c2;margin:0 auto 10px}
  .panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
  .panel-head h2{font-size:23px;word-break:break-word}
  .hero{font-size:40px;line-height:1;margin-bottom:6px}
  .heroimg{width:100%;max-height:300px;object-fit:cover;border-radius:18px;display:block;margin-bottom:12px;cursor:zoom-in}
  .gallery{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scroll-snap-type:x mandatory;scrollbar-width:none}
  .gallery::-webkit-scrollbar{display:none}
  .gallery img{height:190px;max-width:85%;object-fit:cover;border-radius:16px;scroll-snap-align:start;cursor:zoom-in;flex:none}
  .field{margin-bottom:12px}
  .field label.l{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
  .field .hint{font-weight:400;color:var(--muted)}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px;cursor:pointer;min-height:44px}
  .seg button.on{border-color:var(--sky);background:var(--sky-soft);font-weight:600}
  .actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:8px}
  .actions .right{display:flex;gap:8px}
  .links{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .linkbox{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;text-decoration:none;color:var(--ink)}
  .linkbox .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none}
  .linkbox .tx{display:flex;flex-direction:column;min-width:0}
  .linkbox .tx b{font-weight:600;word-break:break-word}
  .linkbox .tx span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:right}
  .section{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
  .section h3{font-size:17px;margin-bottom:8px}
  .section .body{white-space:pre-wrap;word-break:break-word}
  .section.missing{color:var(--muted);font-style:italic}
  .foot{font-size:12px;color:var(--muted);margin-top:4px}
  .confirm{display:none;background:#fdecea;border-radius:14px;padding:10px 12px;margin-top:10px;font-size:14px}
  .confirm.open{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .cat-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  .cat-item{display:flex;gap:8px;align-items:center}
  .cat-item input{flex:1}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:30;display:none;align-items:center;justify-content:center}
  .lightbox.open{display:flex}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain}
  .lightbox button{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:20px;cursor:pointer}
  .toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:all .2s;pointer-events:none;z-index:40;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo" id="logo">🍳</div>
    <div>
      <h1>הספר שלנו</h1>
      <div class="sub" id="countLine">טוען…</div>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>

  <!-- RECIPES -->
  <section id="recipesView">
    <form class="quick" id="quickForm" autocomplete="off">
      <div class="title">✨ מתכון חדש</div>
      <input type="text" id="qName" placeholder="שם המתכון (למשל: אורז פרסי עם תחדיג)">
      <input type="url" id="qUrl" placeholder="קישור (אינסטגרם, פייסבוק…)" inputmode="url">
      <button type="button" class="btn small fetchbtn" id="qFetch">✨ משיכת המתכון מהקישור</button>
      <div class="fetchbox" id="qFetched" hidden>
        <label class="l" for="qIng">🧺 מצרכים</label><textarea id="qIng" dir="auto"></textarea>
        <label class="l" for="qSteps">👩‍🍳 אופן ההכנה</label><textarea id="qSteps" dir="auto" style="min-height:140px"></textarea>
      </div>
      <select id="qCat"></select>
      <input type="text" id="qNewCat" placeholder="שם הקטגוריה החדשה" hidden>
      <div class="row" style="align-items:center;justify-content:space-between;flex-wrap:wrap">
        <div class="row" style="align-items:center;gap:8px;flex-wrap:wrap">
          <button type="button" class="photobtn" data-needs-assets data-file="qPhoto">📷 תמונות</button><input type="file" accept="image/*" multiple id="qPhoto" class="vh">
          <div class="thumbs" id="qThumbs"></div>
        </div>
        <button class="btn primary" type="submit" id="qBtn">שמירה</button>
      </div>
    </form>

    <div class="filters">
      <div class="chips" id="catChips"></div>
      <div class="search-row">
        <input type="text" id="search" placeholder="🔍 חיפוש לפי שם, מצרכים, הערות…">
        <select id="statusFilter">
          <option value="all">הכול</option>
          <option value="later">שמורים לאחר כך</option>
          <option value="done">כתובים</option>
        </select>
      </div>
    </div>
    <div id="list" class="grid"></div>
    <div style="margin-top:18px;text-align:center">
      <button class="btn ghost" id="manageCatsBtn">✏️ עריכת קטגוריות</button>
    </div>
  </section>

  <!-- RESTAURANTS -->
  <section id="placesView" hidden>
    <form class="quick green" id="pQuickForm" autocomplete="off">
      <div class="title">📍 מסעדה חדשה</div>
      <input type="text" id="pqName" placeholder="שם המסעדה">
      <textarea id="pqDesc" placeholder="תיאור (לא חובה): מה להזמין, מי המליץ…" style="min-height:64px"></textarea>
      <input type="url" id="pqUrl" placeholder="קישור (לא חובה)" inputmode="url">
      <input type="text" id="pqAddr" placeholder="כתובת (לא חובה)">
      <div class="row" style="align-items:center;justify-content:space-between;flex-wrap:wrap">
        <div class="row" style="align-items:center;gap:8px;flex-wrap:wrap">
          <button type="button" class="photobtn" data-needs-assets data-file="pqPhotos">📷 תמונות</button><input type="file" accept="image/*" multiple id="pqPhotos" class="vh">
          <div class="thumbs" id="pqThumbs"></div>
        </div>
        <button class="btn primary green" type="submit" id="pqBtn">הוספה</button>
      </div>
    </form>
    <div class="search-row" style="margin-bottom:6px">
      <input type="text" id="pSearch" placeholder="🔍 חיפוש לפי שם, כתובת, תיאור…">
    </div>
    <div id="pWantWrap">
      <div class="sec-title">🤤 רוצים לנסות <span class="n" id="pWantN"></span></div>
      <div class="plist" id="pWant"></div>
    </div>
    <div id="pBeenWrap">
      <div class="sec-title">✅ היינו שם <span class="n" id="pBeenN"></span></div>
      <div class="plist" id="pBeen"></div>
    </div>
  </section>
</div>

<nav class="tabbar"><div class="inner">
  <button class="tab on" data-tab="recipes"><span class="e">🍝</span>מתכונים</button>
  <button class="tab" data-tab="places"><span class="e">🍽️</span>מסעדות</button>
</div></nav>

<!-- View recipe -->
<div class="overlay" id="viewOv">
  <div class="panel">
    <div class="grab"></div>
    <div class="gallery" id="vGallery" hidden></div>
    <div class="panel-head">
      <div>
        <div class="hero" id="vEmoji"></div>
        <h2 id="vTitle" dir="auto"></h2>
        <div class="meta" id="vMeta" style="margin-top:6px"></div>
      </div>
      <button class="iconbtn" data-close aria-label="סגירה">✕</button>
    </div>
    <div id="vLink" class="links"></div>
    <div id="vSections"></div>
    <div class="foot" id="vFoot"></div>
    <div class="actions">
      <button class="btn danger" id="vDelete">מחיקה</button>
      <div class="right">
        <button class="btn" data-close>סגירה</button>
        <button class="btn primary" id="vEdit">עריכה</button>
      </div>
    </div>
    <div class="confirm" id="vConfirm">
      <span>למחוק את המתכון לשנינו?</span>
      <span style="display:flex;gap:8px">
        <button class="btn small" id="vConfirmNo">ביטול</button>
        <button class="btn small primary" id="vConfirmYes" style="background:#c62828;border-color:#c62828;box-shadow:none">מחיקה</button>
      </span>
    </div>
  </div>
</div>

<!-- Edit recipe -->
<div class="overlay" id="editOv">
  <form class="panel" id="editForm" autocomplete="off">
    <div class="grab"></div>
    <div class="panel-head">
      <h2>עריכת מתכון</h2>
      <button class="iconbtn" type="button" data-close aria-label="סגירה">✕</button>
    </div>
    <div class="field"><label class="l" for="eTitle">שם</label><input type="text" id="eTitle" dir="auto"></div>
    <div class="field"><label class="l" for="eUrl">קישור</label><input type="url" id="eUrl" inputmode="url" placeholder="https://…"><button type="button" class="btn small fetchbtn" id="eFetch" style="margin-top:8px">✨ משיכת המתכון מהקישור</button></div>
    <div class="field">
      <label class="l" for="eCat">קטגוריה</label>
      <select id="eCat"></select>
      <input type="text" id="eNewCat" placeholder="שם הקטגוריה החדשה" style="margin-top:8px" hidden>
    </div>
    <div class="field" data-needs-assets>
      <label class="l">תמונות</label>
      <div class="row" style="align-items:center;gap:8px;flex-wrap:wrap">
        <button type="button" class="photobtn" data-file="ePhoto">📷 הוספת תמונות</button><input type="file" accept="image/*" multiple id="ePhoto" class="vh">
        <div class="thumbs" id="eThumbs"></div>
      </div>
    </div>

<script>
const OTHER="אחר";
const DEFAULT_CATS=["אורז","פסטה","בשר","עוף","דגים","מרקים","סלטים","ירקות","אפייה","קינוחים",OTHER];
const LEGACY={Rice:"אורז",Pasta:"פסטה",Meat:"בשר",Chicken:"עוף",Fish:"דגים",Soups:"מרקים",Salads:"סלטים",Vegetables:"ירקות",Baking:"אפייה",Desserts:"קינוחים",Other:OTHER};
const EMOJI={"אורז":"🍚","פסטה":"🍝","בשר":"🥩","עוף":"🍗","דגים":"🐟","מרקים":"🍲","מרק":"🍲","סלטים":"🥗","סלט":"🥗","ירקות":"🥦","אפייה":"🥖","לחם":"🍞","קינוחים":"🍰","קינוח":"🍰","עוגות":"🎂","עוגיות":"🍪","ארוחת בוקר":"🍳","בוקר":"🍳","שתייה":"🍹","משקאות":"🍹","רטבים":"🥫","שבת":"🕯️","ילדים":"🧸","טבעוני":"🌱","צמחוני":"🌱","פיצה":"🍕","ממרחים":"🥣","אסייתי":"🥢",[OTHER]:"🍴"};
const TINTS=["var(--tomato-soft)","var(--mango-soft)","var(--mint-soft)","var(--berry-soft)","var(--sky-soft)"];
const $=s=>document.querySelector(s);

let db=null,user=null,assets=null,myId=null;
let recipes=[],places=[],categories=DEFAULT_CATS.slice();
let filterCat="all",tab="recipes";
let currentId=null,editingId=null,pCurrentId=null,pEditingId=null;
let canWrite=true,loaded=false,pLoaded=false;

/* ---------- helpers ---------- */
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2300);}
function notice(m){const n=$("#notice");n.textContent=m||"";n.hidden=!m;}
const catOf=r=>LEGACY[r.category]||r.category||OTHER;
const catEmoji=c=>EMOJI[(c||"").trim()]||"🍴";
function catTint(c){let h=0;for(const ch of (c||""))h=(h*31+ch.charCodeAt(0))>>>0;return TINTS[h%TINTS.length];}
function sourceOf(url){if(!url)return "";try{const h=new URL(url).hostname.replace(/^www\.|^m\./,"");
  if(h.includes("instagram"))return "אינסטגרם";if(h.includes("facebook")||h.includes("fb.watch")||h==="fb.com")return "פייסבוק";
  if(h.includes("tiktok"))return "טיקטוק";if(h.includes("youtu"))return "יוטיוב";return h;}catch(e){return "";}}
function srcIcon(s){return {"אינסטגרם":["📸","var(--berry-soft)"],"פייסבוק":["👍","var(--sky-soft)"],"טיקטוק":["🎵","var(--mint-soft)"],"יוטיוב":["▶️","var(--tomato-soft)"]}[s]||["🔗","var(--mango-soft)"];}
function safeUrl(u){try{const x=new URL(u);return (x.protocol==="http:"||x.protocol==="https:")?x.href:null;}catch(e){return null;}}
function cleanUrl(v){v=(v||"").trim();if(v&&!/^https?:\/\//i.test(v))v="https://"+v;return v;}
const rPhotos=r=>{const a=Array.isArray(r.photos)?r.photos.slice():[];if(validId(r.photo)&&!a.includes(r.photo))a.unshift(r.photo);return a.filter(validId);};
const isWritten=r=>!!((r.ingredients||"").trim()||(r.instructions||"").trim());
const fmtDate=ms=>ms?new Date(ms).toLocaleDateString("he-IL",{day:"numeric",month:"short",year:"numeric"}):"";
const blobUrl=id=>"https://drive.google.com/thumbnail?id="+encodeURIComponent(id)+"&sz=w1600";
const validId=id=>typeof id==="string"&&/^[A-Za-z0-9_-]{8,64}$/.test(id);
function el(tag,attrs={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else e.setAttribute(k,v);}for(const k of kids)if(k!=null&&k!==false)e.append(k);return e;}
function img(id,cls){const i=el("img",{src:blobUrl(id),alt:"",loading:"lazy"});if(cls)i.className=cls;i.onerror=()=>{i.style.visibility="hidden";};return i;}
function linkBox(url,title,sub,icon,tint){return el("a",{class:"linkbox",href:url,target:"_blank",rel:"noopener"},el("span",{class:"ic",style:"background:"+tint,text:icon}),el("span",{class:"tx"},el("b",{text:title}),el("span",{text:sub})));}
async function names(ids){const out={};if(!user||!user.profiles)return out;try{const ps=await user.profiles(ids.filter(Boolean));for(const id of ids)out[id]=(ps&&ps[id]&&ps[id].name)||"";}catch(e){}return out;}
async function fillFoot(elm,r,stillOpen){elm.textContent="";const n=await names([r.addedBy,r.updatedBy]);if(!stillOpen())return;const p=[];
  if(r.createdAt)p.push("נוסף "+fmtDate(r.createdAt)+(n[r.addedBy]?" ע״י "+n[r.addedBy]:""));
  if(r.updatedAt&&r.updatedAt!==r.createdAt)p.push("עודכן "+fmtDate(r.updatedAt)+(n[r.updatedBy]?" ע״י "+n[r.updatedBy]:""));elm.textContent=p.join(" · ");}
function openLightbox(id){$("#lbImg").src=blobUrl(id);$("#lightbox").classList.add("open");}
$("#lightbox").onclick=()=>$("#lightbox").classList.remove("open");

/* ---------- photos ---------- */
function decodeViaImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{res(i);};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("decode"));};i.src=u;});}
async function shrink(file){
  let src=null,w=0,h=0;
  try{src=await createImageBitmap(file);w=src.width;h=src.height;}catch(e){}
  if(!src){try{src=await decodeViaImg(file);w=src.naturalWidth;h=src.naturalHeight;}catch(e){}}
  if(!src||!w||!h)return null;
  const max=1600,sc=Math.min(1,max/Math.max(w,h));
  const c=document.createElement("canvas");c.width=Math.round(w*sc);c.height=Math.round(h*sc);
  c.getContext("2d").drawImage(src,0,0,c.width,c.height);
  return await new Promise(r=>{try{c.toBlob(b=>r(b),"image/jpeg",.82);}catch(e){r(null);}});
}
const OK_TYPES=/^image\/(png|jpeg|gif|webp)$/;
async function uploadPhoto(file){
  if(!assets)throw {code:"no_assets"};
  let b=null;try{b=await shrink(file);}catch(e){}
  if(b&&b.size){try{return (await assets.upload(b,{type:"image/jpeg"})).id;}catch(e){if(!OK_TYPES.test(file.type||""))throw e;}}
  if(OK_TYPES.test(file.type||""))return (await assets.upload(file,{type:file.type})).id;
  throw {code:"unsupported_type"};
}
function photoErr(e){console.error(e);const c=(e&&e.code)||"";
  toast(c==="too_large"?"התמונה גדולה מדי":c==="unsupported_type"?"סוג הקובץ לא נתמך, נסו צילום מסך של התמונה":c==="quota_or_state"?"נגמר המקום לתמונות":c==="no_assets"||c==="not_granted"?"אין הרשאה להעלות תמונות":"העלאת התמונה נכשלה"+(c?" ("+c+")":""));}
function removeAssets(ids){if(!assets)return;for(const id of ids||[])if(validId(id))assets.delete(id).catch(()=>{});}

/* A small photo picker that uploads on pick and keeps a list of asset ids */
function picker(inputSel,thumbsSel,multi){
  const st={ids:[],busy:0,added:[]};
  const draw=()=>{const box=$(thumbsSel);box.innerHTML="";
    for(const id of st.ids){const x=el("button",{type:"button","aria-label":"הסרה",text:"✕"});x.onclick=()=>{st.ids=st.ids.filter(i=>i!==id);draw();};
      box.append(el("div",{class:"thumb"},img(id),x));}
    for(let i=0;i<st.busy;i++)box.append(el("div",{class:"thumb loading"}));};
  const handle=async files=>{
    files=files.filter(f=>f&&(!f.type||f.type.startsWith("image/")));if(!files.length)return;
    if(!multi){files.length=1;}
    st.busy+=files.length;draw();
    let ok=0;for(const f of files){try{const id=await uploadPhoto(f);if(!multi)st.ids=[id];else st.ids.push(id);st.added.push(id);ok++;}catch(err){photoErr(err);}st.busy--;draw();}
    if(ok)toast(ok>1?ok+" תמונות נוספו 📷":"התמונה נוספה 📷");
  };
  const inp=$(inputSel);
  inp.addEventListener("change",e=>{const f=[...e.target.files];e.target.value="";handle(f);});
  // paste a copied photo anywhere in the same form
  const form=inp.closest("form");
  if(form)form.addEventListener("paste",e=>{const f=[...((e.clipboardData&&e.clipboardData.files)||[])].filter(x=>x.type.startsWith("image/"));if(f.length){e.preventDefault();handle(f);}});
  st.set=ids=>{st.ids=(ids||[]).filter(validId);st.added=[];st.busy=0;draw();};
  st.clear=()=>st.set([]);
  st.add=id=>{if(validId(id)&&!st.ids.includes(id)){st.ids.push(id);st.added.push(id);draw();}};
  return st;
}
const qPick=picker("#qPhoto","#qThumbs",true);
const ePick=picker("#ePhoto","#eThumbs",true);
const pqPick=picker("#pqPhotos","#pqThumbs",true);
const pePick=picker("#pePhotos","#peThumbs",true);

/* ---------- tabs ---------- */
function setTab(t){
  tab=t;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  $("#recipesView").hidden=t!=="recipes";$("#placesView").hidden=t!=="places";
  const L=$("#logo");L.textContent=t==="recipes"?"🍳":"🍽️";L.style.background=t==="recipes"?"var(--tomato)":"var(--mint)";L.style.boxShadow=t==="recipes"?"0 4px 0 #d94e30":"0 4px 0 #2a9e80";
  try{localStorage.setItem("rb_tab",t);}catch(e){}
  updateCount();window.scrollTo(0,0);
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function updateCount(){
  if(tab==="recipes"){const later=recipes.filter(r=>!isWritten(r)).length;$("#countLine").textContent=loaded?`${recipes.length} מתכונים · ${later} שמורים לאחר כך`:"טוען…";}
  else{const want=places.filter(p=>p.status!=="been").length;$("#countLine").textContent=pLoaded?`${places.length} מסעדות · ${want} שרוצים לנסות`:"טוען…";}
}

/* ---------- categories select (with "new") ---------- */
const NEW="__new__";
function fillSelect(sel,value,newInput){
  sel.innerHTML="";
  for(const c of categories)sel.append(el("option",{value:c,text:catEmoji(c)+" "+c}));
  sel.append(el("option",{value:NEW,text:"➕ קטגוריה חדשה…"}));
  sel.value=categories.includes(value)?value:(categories.includes(OTHER)?OTHER:categories[0]);
  if(newInput){newInput.hidden=true;newInput.value="";}
}
function wireNewCat(sel,inp){sel.addEventListener("change",()=>{inp.hidden=sel.value!==NEW;if(!inp.hidden)inp.focus();});}
wireNewCat($("#qCat"),$("#qNewCat"));wireNewCat($("#eCat"),$("#eNewCat"));
/* returns chosen category, creating it if needed; null if invalid */
async function resolveCat(sel,inp){
  if(sel.value!==NEW)return sel.value;
  const n=inp.value.trim();if(!n){toast("כתבו שם לקטגוריה החדשה");inp.focus();return null;}
  const exist=categories.find(c=>c.toLowerCase()===n.toLowerCase());if(exist)return exist;
  const next=categories.filter(c=>c!==OTHER).concat([n,OTHER]);
  await db.doc("settings/categories").set({list:next});categories=next;
  return n;
}

/* ---------- recipes list ---------- */
function renderChips(){
  const box=$("#catChips");box.innerHTML="";
  const counts={};for(const r of recipes){const c=catOf(r);counts[c]=(counts[c]||0)+1;}
  const all=[["all","🌈 הכול",recipes.length],...categories.map(c=>[c,catEmoji(c)+" "+c,counts[c]||0])];
  for(const [v,label,n] of all){
    if(v!=="all"&&n===0&&filterCat!==v)continue;
    const b=el("button",{class:"chip"+(filterCat===v?" on":""),type:"button"},label,el("span",{class:"n",text:String(n)}));
    b.onclick=()=>{filterCat=v;render();};box.append(b);
  }
}
function render(){
  renderChips();updateCount();
  const q=$("#search").value.trim().toLowerCase(),st=$("#statusFilter").value;
  const list=$("#list");list.innerHTML="";
  if(!loaded){list.append(el("div",{class:"empty",style:"grid-column:1/-1"},el("span",{class:"big",text:"🥄"}),"מערבבים את הסיר…"));return;}
  const rows=recipes.filter(r=>{
    if(filterCat!=="all"&&catOf(r)!==filterCat)return false;
    if(st==="later"&&isWritten(r))return false;if(st==="done"&&!isWritten(r))return false;
    if(q&&![r.title,r.ingredients,r.instructions,r.notes,r.url,catOf(r)].join(" ").toLowerCase().includes(q))return false;
    return true;});
  if(!rows.length){list.append(el("div",{class:"empty",style:"grid-column:1/-1"},el("span",{class:"big",text:recipes.length?"🤷":"🧑‍🍳"}),recipes.length?"אין מתכונים שמתאימים לסינון":"עוד אין מתכונים. הוסיפו את הראשון למעלה!"));return;}
  for(const r of rows){
    const w=isWritten(r),c=catOf(r);
    const top=el("div",{class:"top",style:"background:"+catTint(c)});
    if(rPhotos(r).length)top.append(img(rPhotos(r)[0]));else top.textContent=catEmoji(c);
    const card=el("div",{class:"card",tabindex:"0"},top,
      el("div",{class:"inner"},
        el("h3",{dir:"auto",text:r.title||(sourceOf(r.url)?"מתכון מ"+sourceOf(r.url):"מתכון ללא שם")}),
        el("div",{class:"meta"},el("span",{class:"tag",text:c}),w?el("span",{class:"tag done",text:"כתוב"}):null)));
    card.onclick=()=>openView(r.id);card.onkeydown=e=>{if(e.key==="Enter")openView(r.id);};
    list.append(card);
  }
}

/* ---------- overlays ---------- */
function openOv(id){$(id).classList.add("open");$(id).querySelector(".panel").scrollTop=0;document.body.style.overflow="hidden";}
function closeOv(id){$(id).classList.remove("open");if(!document.querySelector(".overlay.open"))document.body.style.overflow="";}
document.querySelectorAll(".overlay").forEach(ov=>ov.addEventListener("click",e=>{if(ov.id==="gateOv")return;if(e.target===ov||e.target.closest("[data-close]"))closeOv("#"+ov.id);}));
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#lightbox").classList.contains("open")){$("#lightbox").classList.remove("open");return;}const o=[...document.querySelectorAll(".overlay.open")].pop();if(o&&o.id!=="gateOv")closeOv("#"+o.id);}});

/* ---------- writes ---------- */
function guardWrite(){if(!db){toast("כדי לשמור צריך להיות מחוברים ל-Claude");return false;}if(!canWrite){toast("יש לך הרשאת צפייה בלבד");return false;}return true;}
function handleWriteError(e){console.error(e);
  if(e&&e.code==="invalid_argument"){canWrite=false;notice("אפשר לצפות אבל לא לשמור. בקשו מהבעלים לשתף איתך את הדף כעורך/ת (Editor).");render();renderPlaces();}
  else if(e&&e.code==="quota_exceeded")toast("אין יותר מקום. מחקו פריטים ישנים");else toast("השמירה נכשלה, נסו שוב");}

/* ---------- recipe quick add ---------- */
$("#quickForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const title=$("#qName").value.trim(),url=cleanUrl($("#qUrl").value);
  if(!title&&!url){toast("הוסיפו שם או קישור");$("#qName").focus();return;}
  if(url&&!safeUrl(url)){toast("הקישור לא נראה תקין");return;}
  if(qPick.busy){toast("רגע, התמונות עוד עולות…");return;}
  if(!guardWrite())return;
  const btn=$("#qBtn");btn.disabled=true;
  try{

async function move(arr,idx,dir){

  };}

const ING_HEAD=/^(?:[^\p{L}\d]*)(מצרכים|המצרכים|רכיבים|הרכיבים|חומרים|החומרים|מה צריך|ingredients?|you(?:'|’)ll need)(?=$|[\s:：\-–.!])/iu;
const STEP_HEAD=/^(?:[^\p{L}\d]*)(אופן ה?הכנה|הוראות ה?הכנה|ההכנה|הכנה|שלבי ה?הכנה|instructions?|directions?|method|preparation|steps?)(?=$|[\s:：\-–.!])/iu;
const QTY=/^(?:[-•*·▪️✔️✅🔸🔹]\s*)?(?:\d|½|¼|¾|⅓|⅔|חצי|רבע|שליש|כוס|כוסות|כף|כפות|כפית|כפיות|קורט|מעט|קופסה|קופסת|חבילה|חבילת|שן|שיני|ק"ג|גרם|מ"ל|ליטר)/;
function cleanCaption(t){
  return String(t||"").split("\n").map(x=>x.replace(/\s+$/,""))
    .filter(x=>!/^\s*(#\S+\s*)+$/.test(x)&&!/^\s*\.\s*$/.test(x)).join("\n").replace(/\n{3,}/g,"\n\n").trim();
}
function splitRecipe(text){
  const t=cleanCaption(text);const lines=t.split("\n");
  let iH=-1,sH=-1;
  lines.forEach((l,i)=>{const x=l.trim();if(x.length>40)return;if(iH<0&&ING_HEAD.test(x))iH=i;else if(sH<0&&STEP_HEAD.test(x)&&i>iH)sH=i;});
  const strip=(a,b)=>lines.slice(a,b).join("\n").trim();
  const headRest=i=>lines[i].replace(ING_HEAD,"").replace(STEP_HEAD,"").replace(/^[\s:：\-–]+/,"").trim();
  if(iH>=0){
    const ing=[headRest(iH),strip(iH+1,sH>=0?sH:lines.length)].filter(Boolean).join("\n");
    const steps=sH>=0?[headRest(sH),strip(sH+1,lines.length)].filter(Boolean).join("\n"):"";
    const intro=strip(0,iH);
    return {ingredients:ing,instructions:steps,intro};
  }
  // no headings: lines that look like quantities are ingredients, the rest is instructions
  const ing=[],rest=[],pre=[];
  for(const l of lines){const x=l.trim();const isIng=x&&x.length<70&&QTY.test(x);if(isIng)ing.push(x);else (ing.length?rest:pre).push(x);}
  if(ing.length>=2)return {ingredients:ing.join("\n"),instructions:rest.join("\n").replace(/\n{3,}/g,"\n\n").trim(),intro:pre.join("\n").trim()};
  return {ingredients:"",instructions:t,intro:""};
}
function guessTitle(caption,ogTitle){
  const first=cleanCaption(caption).split("\n").map(x=>x.trim()).find(x=>x&&!ING_HEAD.test(x));
  let t=first||ogTitle||"";t=t.replace(/[#@]\S+/g,"").replace(/\s+/g," ").trim();
  if(t.length>60)t=t.slice(0,57).replace(/\s+\S*$/,"")+"…";return t;
}
async function fetchFromLink(urlSel,btn){
  const url=cleanUrl($(urlSel).value);
  if(!url||!safeUrl(url)){toast("הדביקו קודם קישור");$(urlSel).focus();return null;}
  if(!PW){showGate();return null;}
  const label=btn.textContent;btn.disabled=true;btn.textContent="⏳ מושך את המתכון…";
  try{
    const j=await api("fetchLink",{url});const d=j.data||{};
    if(!d.caption&&!d.photoId){toast("לא הצלחנו למשוך מהקישור הזה. אפשר לכתוב ידנית ✍️");return null;}
    const parts=splitRecipe(d.caption||"");
    return {title:guessTitle(d.caption||"",d.title||""),photoId:d.photoId||"",parts,raw:d.caption||""};
  }catch(e){
    toast(e&&e.code==="unknown_action"?"צריך לעדכן את הסקריפט בגוגל שיטס (ראו הוראות)":e&&e.code==="network"?"אין חיבור לאינטרנט, נסו שוב":"לא הצלחנו למשוך מהקישור. אפשר לכתוב ידנית ✍️");
    return null;
  }finally{btn.disabled=false;btn.textContent=label;}
}
$("#qFetch").addEventListener("click",async()=>{
  const r=await fetchFromLink("#qUrl",$("#qFetch"));if(!r)return;
  if(!$("#qName").value.trim()&&r.title)$("#qName").value=r.title;
  if(r.photoId)qPick.add(r.photoId);
  const p=r.parts;
  $("#qIng").value=p.ingredients;$("#qSteps").value=p.instructions||p.intro;
  $("#qFetched").hidden=false;
  toast(r.raw?"המתכון נמשך! בדקו ותקנו אם צריך ✨":"נמשכה רק תמונה, את המתכון צריך לכתוב ✍️");
});
$("#eFetch").addEventListener("click",async()=>{
  const r=await fetchFromLink("#eUrl",$("#eFetch"));if(!r)return;
  if(!$("#eTitle").value.trim()&&r.title)$("#eTitle").value=r.title;
  if(r.photoId)ePick.add(r.photoId);
  const p=r.parts;let filled=false;
  if(!$("#eIng").value.trim()&&p.ingredients){$("#eIng").value=p.ingredients;filled=true;}
  const steps=p.instructions||p.intro;
  if(!$("#eSteps").value.trim()&&steps){$("#eSteps").value=steps;filled=true;}
  toast(filled?"המתכון נמשך! בדקו ותקנו אם צריך ✨":r.photoId?"נוספה תמונה (הטקסט שכבר כתוב לא שונה)":"לא היה מה להוסיף");
});

(function start(){
  db=sheetDb;assets=sheetAssets;canWrite=true;
  document.querySelectorAll("[data-needs-assets]").forEach(x=>x.hidden=false);
  if(!PW){loaded=pLoaded=true;render();renderPlaces();showGate();}
  else refresh();
  setInterval(()=>{if(document.visibilityState==="visible"&&!document.querySelector(".overlay.open"))refresh(true);},30000);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refresh(true);});
})();
</script>
